  function sendChat(text){if(!text.trim())return;s.messages.push({role:'user',text:text.trim()},{role:'assistant',text:reply(text)});s.messages=s.messages.slice(-40);save();document.querySelector('#messages').innerHTML=renderMessages();const log=document.querySelector('#messages');log.scrollTop=log.scrollHeight;const input=document.querySelector('#chat-input');input.value='';input.focus();}
  document.addEventListener('input',ev=>{const key=ev.target.dataset.profile;if(key){s.profile[key]=key==='areas'?ev.target.value.split(',').map(t=>t.trim()).filter(Boolean).slice(0,10):ev.target.value;save();const p=document.querySelector('#brand-name-preview');if(p)p.textContent=agent();}if(ev.target.id==='idea-note'){const item=s.plan.find(i=>i.id===activeIdea);if(item){item.note=ev.target.value;save();}}if(ev.target.id==='photo-headline'){photoHeadline=ev.target.value;document.querySelector('.photo-headline').textContent=photoHeadline;}if(ev.target.id==='reception-rules'){s.receptionRules=ev.target.value;save();}});
  document.addEventListener('change',ev=>{if(ev.target.dataset.profile){rebuildPlan();save();if(['font','accent'].includes(ev.target.dataset.profile))render();}if(ev.target.id==='content-format'){format=ev.target.value;render();}if(ev.target.id==='content-purpose'){stage=ev.target.value;render();}if(ev.target.id==='video-file')setVideo(ev.target.files[0]);if(ev.target.id==='photo-file')setPhoto(ev.target.files[0]);if(ev.target.id==='photo-ratio'){photoRatio=ev.target.value;render();}});
  document.addEventListener('submit',ev=>{if(ev.target.id==='lead-form'){ev.preventDefault();const f=new FormData(ev.target);s.leads.push({id:'lead-'+Date.now(),name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),intent:String(f.get('intent')),details:String(f.get('details')).trim(),qualified:false});save();render();toast('Test enquiry saved on this device only.');}if(ev.target.id==='chat-form'){ev.preventDefault();sendChat(document.querySelector('#chat-input').value);}if(ev.target.id==='reception-form'){ev.preventDefault();const input=document.querySelector('#reception-input');const text=input.value.trim();if(!text)return;reception.push({role:'user',text},{role:'assistant',text:/price|available|viewing|book|negotia/i.test(text)?'That needs the agent’s confirmation. In a connected version I would pass this enquiry to them—nothing has been sent or booked in this demo.':'Which area are you considering, what budget do you have in mind, and when would you like to move? These details would help the agent prepare.'});reception=reception.slice(-20);document.querySelector('#reception-messages').innerHTML=renderReception();document.querySelector('#reception-messages').scrollTop=99999;input.value='';input.focus();}});
  document.addEventListener('click',ev=>{if(ev.target.closest('.skip')){ev.preventDefault();const main=document.querySelector('main');main.tabIndex=-1;main.focus();return;}const b=ev.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='idea'){activeIdea=b.dataset.id;render();}if(action==='approve'){const i=s.plan.find(i=>i.id===activeIdea);if(i){i.status='approved';save();render();toast('Idea approved here. Nothing published.');}}if(action==='style'){s.profile.style=b.dataset.value;s.profile.font=b.dataset.value==='editorial'?'serif':'sans';save();render();}if(action==='video-type'){videoType=b.dataset.value;render();}if(action==='remove-video'){if(videoURL)URL.revokeObjectURL(videoURL);videoURL='';footage=null;render();}if(action==='qualify'){const lead=s.leads.find(l=>l.id===b.dataset.id);if(lead){lead.qualified=!lead.qualified;save();render();}}if(action==='suggest')sendChat(b.dataset.value);if(action==='export-video')download('maison-edit-brief.json',JSON.stringify({prototype:true,rendered:false,agent:agent(),brokerage:s.profile.company,contentType:videoType,file:footage?.name||null,style:s.profile.style,font:s.profile.font,accent:s.profile.accent,voice:s.profile.voice,note:'Production specification only. No AI editing, timed captions or rendering performed.'},null,2));if(action==='export-photo')download('maison-photo-brief.json',JSON.stringify({prototype:true,rendered:false,agent:agent(),brokerage:s.profile.company,file:photoFile?.name||null,headline:photoHeadline,ratio:photoRatio,style:s.profile.style,font:s.profile.font,note:'Layout specification only, not an exported image or carousel.'},null,2));if(action==='export-reception')download('maison-receptionist-setup.json',JSON.stringify({prototype:true,connected:false,installed:false,qualification:['Need','Area','Budget','Timeline'],handoffRequired:true,notes:s.receptionRules||'',note:'Setup concept only. Requires approved business account, permissions, verified answers and a real integration.'},null,2));if(action==='export-plan')download('maison-draft-content-plan.md',`# ${agent()} — draft personal-brand content plan\n\nTemplate examples only. No live AI or research.\n\n`+s.plan.map(i=>`## ${i.title}\n\n${formats[i.contentType]} · ${purpose[i.stage]}\n\n${i.script}\n\nYour take: ${i.note||'Not added'}\n\n${i.shots.map(t=>'- '+t).join('\n')}\n\nCTA: ${i.cta}`).join('\n\n'),'text/markdown');});
  window.addEventListener('hashchange',()=>{clearTimeout(toastTimer);document.querySelector('#toast').classList.remove('show');render();window.scrollTo(0,0);document.querySelector('main h1')?.focus({preventScroll:true});});
  render();
})();

</script>
</body>
</html>
